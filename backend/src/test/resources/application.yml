spring:
  datasource:
    url: jdbc:h2:mem:gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

app:
  cors:
    allowed-origin: http://localhost:5173
  oauth:
    issuer-url: http://localhost:8080
