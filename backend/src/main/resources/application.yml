server:
  port: 8080

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

spring:
  application:
    name: secure-actions-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  ai:
    mcp:
      server:
        name: secure-actions-gateway
        version: 0.0.1
        protocol: STREAMABLE
        type: SYNC
